<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event - Mapzo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;600&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="style.css">

  <style>
    /* Specific styles for event details */
    body {
      background-color: #000;
      color: #fff;
      padding-bottom: 40px;
    }

    .eventPageContainer {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Header & Image */
    .eventHeader {
      position: relative;
      width: 100%;
      height: 350px;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 20px;
      background: #1a1a1a;
    }

    .eventHeader img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .eventCategoryBadge {
      position: absolute;
      top: 15px;
      left: 15px;
      background: #1db954;
      color: #000;
      padding: 5px 12px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.85rem;
    }

    .eventTitle {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.8rem;
      margin-bottom: 15px;
    }

    /* Info Cards */
    .infoCard {
      background: #1a1a1a;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .infoRow {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
    }

    .infoRow:last-child {
      margin-bottom: 0;
    }

    .infoIcon {
      width: 40px;
      height: 40px;
      background: #2a2a2a;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1db954;
      margin-right: 15px;
    }

    .infoText h4 {
      margin: 0;
      font-size: 0.9rem;
      color: #888;
    }

    .infoText p {
      margin: 2px 0 0;
      font-size: 1rem;
      font-weight: 600;
    }

    .descCard {
      background: #1a1a1a;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .descTitle {
      font-size: 1.2rem;
      margin-bottom: 10px;
      color: #1db954;
      font-weight: 700;
    }

    .descText {
      line-height: 1.6;
      color: #ccc;
      font-size: 0.95rem;
      white-space: pre-wrap;
    }

    .backButton {
      display: inline-flex;
      align-items: center;
      padding: 10px 15px;
      background: #2a2a2a;
      border-radius: 30px;
      color: white;
      text-decoration: none;
      margin-bottom: 20px;
      font-weight: 600;
      cursor: pointer;
      border: none;
    }

    .backButton i {
      margin-right: 8px;
    }

    /* ====================
           RATINGS & COMMENTS 
           ==================== */
    .commentsSection {
      background: #1a1a1a;
      border-radius: 16px;
      padding: 20px;
      margin-top: 20px;
    }

    .commentsHeader {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .commentsTitle {
      font-size: 1.2rem;
      font-weight: 700;
      color: #1db954;
    }

    .avgRating {
      font-size: 1.1rem;
      font-weight: 600;
      color: #ffc107;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* Comment Input Area */
    .commentForm {
      margin-bottom: 25px;
      border-bottom: 1px solid #333;
      padding-bottom: 20px;
    }

    .starRating {
      display: flex;
      gap: 5px;
      margin-bottom: 10px;
      flex-direction: row-reverse;
      justify-content: flex-end;
    }

    .starRating input {
      display: none;
    }

    .starRating label {
      font-size: 1.5rem;
      color: #444;
      cursor: pointer;
      transition: color 0.2s;
    }

    .starRating label:hover,
    .starRating label:hover~label,
    .starRating input:checked~label {
      color: #ffc107;
    }

    .commentInput {
      width: 100%;
      background: #2a2a2a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 12px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      resize: none;
      margin-bottom: 10px;
    }

    .commentInput:focus {
      outline: none;
      border-color: #1db954;
    }

    .submitCommentBtn {
      background: #1db954;
      color: #000;
      font-weight: 700;
      padding: 8px 20px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
    }

    .submitCommentBtn:disabled {
      background: #444;
      color: #888;
      cursor: not-allowed;
    }

    /* Comments List */
    .commentsList {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .commentItem {
      background: #222;
      padding: 15px;
      border-radius: 10px;
    }

    .commentUser {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .commentStars {
      color: #ffc107;
      font-size: 0.8rem;
    }

    .commentText {
      color: #ccc;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .commentDate {
      font-size: 0.75rem;
      color: #666;
      margin-top: 5px;
    }
  </style>

  <link rel="preconnect" href="https://backend-jwqn.onrender.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://www.gstatic.com">

  <script defer src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>

<body>

  <div class="eventPageContainer">
    <button onclick="window.location.href='index.html'" class="backButton">
      <i class="fa-solid fa-arrow-left"></i> Back
    </button>

    <div id="loadingState" style="text-align: center; margin-top: 50px;">
      <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 2rem; color: #1db954;"></i>
      <p style="margin-top: 15px; color: #888;">Loading Event...</p>
    </div>

    <div id="eventContent" style="display: none;">
      <div class="eventHeader">
        <img id="displayImage" src="" alt="Event Cover">
        <span class="eventCategoryBadge" id="displayCategory">Category</span>
      </div>

      <h1 class="eventTitle" id="displayTitle">Event Title</h1>

      <button id="joinEventBtn" class="authPrimaryBtn" style="margin-bottom: 20px; display: none;">
        <i class="fa-solid fa-ticket"></i> Interested
      </button>
      <div id="joinedStatus" style="display:none; color: #1db954; font-weight: 700; margin-bottom: 20px;">
        <i class="fa-solid fa-circle-check"></i> You are interested in this event!
      </div>

      <div class="infoCard">
        <div class="infoRow">
          <div class="infoIcon"><i class="fa-regular fa-calendar"></i></div>
          <div class="infoText">
            <h4>Date & Time</h4>
            <p><span id="displayDate"></span> • <span id="displayTime"></span></p>
          </div>
        </div>
        <div class="infoRow">
          <div class="infoIcon"><i class="fa-solid fa-location-dot"></i></div>
          <div class="infoText">
            <h4>Location</h4>
            <p id="displayLocation">Location Name</p>
          </div>
        </div>
      </div>

      <div class="descCard">
        <h3 class="descTitle">About Event</h3>
        <p class="descText" id="displayDesc">Description goes here...</p>
        <p style="margin-top: 15px; color: #1db954; font-weight: 600;" id="displayTags"></p>
      </div>

      <div class="commentsSection">
        <div class="commentsHeader">
          <span class="commentsTitle">Reviews & Chat</span>
          <span class="avgRating"><i class="fa-solid fa-star"></i> <span id="avgRatingVal">--</span></span>
        </div>

        <div class="commentForm" id="addCommentBox">
          <div class="starRating">
            <input type="radio" name="rating" id="star5" value="5"><label for="star5" title="5 stars">★</label>
            <input type="radio" name="rating" id="star4" value="4"><label for="star4" title="4 stars">★</label>
            <input type="radio" name="rating" id="star3" value="3"><label for="star3" title="3 stars">★</label>
            <input type="radio" name="rating" id="star2" value="2"><label for="star2" title="2 stars">★</label>
            <input type="radio" name="rating" id="star1" value="1"><label for="star1" title="1 star">★</label>
          </div>
          <textarea class="commentInput" id="commentText" rows="3" placeholder="Share your experience..."></textarea>
          <button class="submitCommentBtn" onclick="submitComment()">Post Review</button>
        </div>
        <div id="loginToComment"
          style="display:none; text-align:center; padding:15px; background:#2a2a2a; border-radius:8px; margin-bottom:20px;">
          <p style="color:#aaa;">Please log in to rate and comment.</p>
        </div>

        <div class="commentsList" id="commentsList">
          <p style="text-align:center; color:#666;">No reviews yet. Be the first!</p>
        </div>
      </div>
    </div>
  </div>

  <script defer src="utils.js"></script>
  <script defer src="event.js"></script>
</body>

</html>
